<title>Moja receptová kniha</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#8a2f4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recepty">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Instrument+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#f3f4ef;--paper:#fbfbf8;--ink:#23261f;--muted:#666b5e;--line:#dcdfd3;--accent:#8a2f4a;--accent-soft:#f1e3e7;--err:#a3271f}
@media (prefers-color-scheme:dark){:root{--bg:#171915;--paper:#20231d;--ink:#e9eadf;--muted:#a2a795;--line:#353a2f;--accent:#e08aa3;--accent-soft:#3a2530;--err:#f08a80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;display:grid;place-items:center;padding:24px 16px}
.box{width:100%;max-width:380px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 26px 26px}
.ey{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{font-family:"Gloock",Georgia,serif;font-weight:400;font-size:36px;line-height:1.05;margin:8px 0 6px}
h1 em{font-style:normal;color:var(--accent)}
p{color:var(--muted);margin:0 0 20px;line-height:1.45}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:17px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.row{display:flex;align-items:center;gap:8px;margin:12px 0 18px;font-size:14px;color:var(--muted)}
.row input{width:18px;height:18px;accent-color:var(--accent)}
button{width:100%;font:inherit;font-weight:600;font-size:16px;padding:13px;border:0;border-radius:12px;background:var(--accent);color:var(--paper);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--err)}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <div class="ey">Súkromná zbierka</div>
  <h1>Moja receptová <em>kniha</em></h1>
  <p>Na vstup zadaj registračný kód.</p>
  <label for="code">Registračný kód</label>
  <input id="code" type="password" autocomplete="current-password" required>
  <div class="row"><input id="keep" type="checkbox" checked><label for="keep" style="margin:0;font-weight:400">Zapamätať na tomto zariadení</label></div>
  <button id="go" type="submit">Vstúpiť</button>
  <div class="msg" id="msg" role="alert"></div>
</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const tob64 = u => btoa(String.fromCharCode(...new Uint8Array(u)));
const KEY = "rk-key-" + P.v;
async function open(rawKey){
  const key = await crypto.subtle.importKey("raw", rawKey, "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.iv)}, key, b64(P.ct));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(code){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim()), "PBKDF2", false, ["deriveBits"]);
  return crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(P.salt), iterations:P.it}, base, 256);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved) { try { await open(b64(saved)); return; } catch(e) { try { localStorage.removeItem(KEY); } catch(_) {} } }
  document.getElementById("code").focus();
})();
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Overujem…"; msg.textContent = "";
  try {
    const keep = document.getElementById("keep").checked;
    const raw = await derive(document.getElementById("code").value);
    await open(raw);
    if (keep) { try { localStorage.setItem(KEY, tob64(raw)); } catch(_) {} }
  } catch(err) {
    btn.disabled = false; btn.textContent = "Vstúpiť";
    msg.textContent = "Nesprávny kód. Skontroluj veľké a malé písmená a skús znova.";
  }
});
